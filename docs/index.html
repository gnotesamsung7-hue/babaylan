<title>Babaylan: Rise of the Bakunawa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Noto+Sans+Tagalog&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6dac4; --surface:#f2e8d5; --surface2:#ddcdb0; --ink:#2a1f2e; --dim:#6b5b5e;
  --line:#c4b08c; --gold:#8f6a1c; --danger:#a3321f; --ok:#3a7334; --school:#8f6a1c;
  --display:'IM Fell English SC','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17121c; --surface:#221a29; --surface2:#2e2337; --ink:#eadfc8; --dim:#a4958a;
    --line:#3e3048; --gold:#d3ab52; --danger:#e36a58; --ok:#86c46f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17121c; --surface:#221a29; --surface2:#2e2337; --ink:#eadfc8; --dim:#a4958a;
  --line:#3e3048; --gold:#d3ab52; --danger:#e36a58; --ok:#86c46f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--school);outline-offset:2px}
.app{max-width:540px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column}
:fullscreen body,:-webkit-full-screen body{background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em}

/* header */
.top{padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.top-row{display:flex;align-items:center;gap:10px}
.crest{width:14px;height:14px;border-radius:50%;background:var(--school);box-shadow:0 0 0 3px color-mix(in srgb,var(--school) 30%,transparent);flex:none}
.who{flex:1;min-width:0}
.who h1{font-size:1.2rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--dim);font-size:.82rem}
.bank{text-align:right}
.bank b{font-family:var(--display);font-size:1.5rem;line-height:1;color:var(--gold)}
.bank small{display:block;color:var(--dim);font-size:.75rem}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:1.1rem;flex:none}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:8px}
.res div{text-align:center;padding:4px 0;background:var(--surface2);font-size:.95rem;font-variant-numeric:tabular-nums}
.res div:first-child{border-radius:6px 0 0 6px}.res div:last-child{border-radius:0 6px 6px 0}
.res span{display:block;color:var(--dim);font-size:.7rem;line-height:1}

main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface)}
nav.tabs button{background:none;border:0;padding:8px 0 9px;font-size:.74rem;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button i{font-style:normal;font-size:1.15rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--school)}

/* sigil */
.sigil-wrap{display:grid;place-items:center;margin:2px 0 6px}
.sigil{width:min(68vw,250px);height:auto}
.sigil .spin{transform-origin:120px 120px;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sigil .spin{animation:none}}
.realm-line{text-align:center;color:var(--dim);font-size:.9rem;margin-bottom:14px}
.realm-line b{color:var(--ink);font-weight:500}

.sect{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect h2{font-size:1.25rem}
.sect small{color:var(--dim);font-size:.82rem}
.note{color:var(--dim);font-size:.88rem;margin:4px 0 10px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:4px 14px 4px 14px;padding:10px 12px;text-align:left;cursor:pointer}
.act b{font-family:var(--display);font-weight:400;font-size:1.08rem;display:block}
.act span{color:var(--dim);font-size:.82rem;display:block}
.act:active{transform:translateY(1px)}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0 10px 12px;border-bottom:1px solid var(--line);position:relative}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--tint,var(--line))}
.row h3{font-size:1.05rem}
.row .meta{color:var(--dim);font-size:.82rem}
.row .meta b{color:var(--ink);font-weight:500}
.row .side{display:flex;align-items:center;gap:6px;justify-self:end}
.row.locked{opacity:.5}
.count{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{background:var(--surface2);border:0;width:32px;height:34px;cursor:pointer;font-size:1.05rem}
.stepper input{width:52px;height:34px;border:0;background:var(--surface);text-align:center;font:inherit;color:var(--ink);font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--ink);color:var(--bg);font-weight:500}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}
.btn.sch{background:var(--school);color:#1a1310}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:.88rem}
.bar-foot{position:sticky;bottom:-24px;margin:12px -14px -24px;padding:12px 14px calc(12px + 0px);background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar-foot small{color:var(--dim)}

.meter{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--school)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.stats b{font-family:var(--display);font-size:1.3rem;font-weight:400;display:block;font-variant-numeric:tabular-nums}
.stats span{color:var(--dim);font-size:.75rem}

.tag{display:inline-block;font-size:.72rem;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:2px;background:var(--surface2);color:var(--dim)}
.tag.hot{background:var(--danger);color:#fff}
.tag.ally{background:var(--ok);color:#fff}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(10,6,12,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom,0px)}

.sheet .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:.92rem;max-width:90vw;text-align:center}

/* setup */
.setup{padding:22px 16px 30px;overflow-y:auto;height:100%}
.title{text-align:center;margin:8px 0 18px}
.title h1{font-size:clamp(2.6rem,13vw,3.6rem);line-height:.95}

.field{margin:16px 0}
.field label,.field .lbl{display:block;font-family:var(--display);font-size:1.1rem;margin-bottom:6px}
.field input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.schools{display:grid;gap:6px}
.sch-opt{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:8px;cursor:pointer}
.sch-opt i{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--c);opacity:.35}
.sch-opt b{font-family:var(--display);font-weight:400;font-size:1.1rem}

.sch-opt[aria-pressed="true"] i{opacity:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--surface);border:0;padding:9px 4px;cursor:pointer;font-size:.92rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg-note{color:var(--dim);font-size:.82rem;margin-top:5px}
.baybayin{font-family:'Noto Sans Tagalog',sans-serif;font-size:1.7rem;color:var(--school);letter-spacing:.2em;margin-top:6px;line-height:1.2}
.lore{font-style:italic;color:var(--dim);font-size:.8rem}
.endcard{text-align:center;padding:30px 18px}
.endcard h1{font-size:2.6rem;margin-bottom:8px}

.chron .row h3{font-size:1.1rem}
/* ===== v2 ===== */
.moons{display:inline-flex;gap:4px;vertical-align:middle;margin:4px 0}

.moons i.gone{background:#141010;border-color:var(--line)}
.eclipse{background:#1b1730;color:#f1e2a6;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-weight:700;text-align:center;border:1px solid #3d3560}
.eclipse.soon{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.warnline{color:var(--danger)}
.offers{list-style:none;padding:0;margin:10px 0 0;font-size:.85rem;color:var(--dim)}
.offers li{display:flex;gap:8px;padding:3px 0;border-top:1px dashed var(--line)}

.gbody{padding:12px 14px}

.abil{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.stars{color:var(--gold);letter-spacing:1px}
.uwrap{display:flex;gap:10px;align-items:flex-start}
.uthumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.uthumb.rival{width:64px;height:64px;border-radius:50%;border:2px solid var(--tint,var(--line))}
.uthumb.ph{display:grid;place-items:center;text-align:center;border:1.5px dashed color-mix(in srgb,var(--c) 70%,var(--line));background:color-mix(in srgb,var(--c) 10%,var(--surface));font-size:.62rem;line-height:1.15;color:var(--dim);padding:4px;text-transform:uppercase;letter-spacing:.04em}
.splash{position:fixed;inset:0;z-index:45;background:rgba(6,4,8,.9);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));animation:kxfade .3s both}
.splash-card{width:min(100%,560px);max-height:100%;overflow-x:hidden;overflow-y:auto;background:#120d16;color:#eadfc8;border:2px solid var(--c);border-radius:16px;box-shadow:0 0 60px color-mix(in srgb,var(--c) 45%,transparent)}
.splash-frame{overflow:hidden}
.splash-art{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;animation:kenburns 6s ease-out both}
@keyframes kenburns{from{transform:scale(1.14)}to{transform:scale(1)}}
.splash-body{padding:14px 16px 16px}
.splash-kicker{font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--c);font-size:.8rem}
.gph{display:grid;place-items:center;aspect-ratio:16/9;background:color-mix(in srgb,var(--c) 18%,#120d16);color:#a4958a;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;border-bottom:1.5px dashed var(--c)}
main.swap>*{animation:swapin .26s ease-out both}
@keyframes swapin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes kxfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){main.swap>*{animation:none!important}}
.splash-body h2{font-family:var(--display);font-size:1.9rem;line-height:1.05;margin-top:2px}
.splash-title{color:#a4958a;margin-bottom:6px}
.splash-body .btn{width:100%;margin-top:8px;padding:12px}
@media (prefers-reduced-motion:reduce){.splash-art,.splash{animation:none!important}}
.keyart{display:block;width:calc(100% + 32px);max-width:none;margin:-22px -16px 0;aspect-ratio:16/9;object-fit:cover;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);mask-image:linear-gradient(to bottom,#000 72%,transparent)}
.sigil-wrap.scene{background-size:cover;background-position:center 42%;border-radius:14px;padding:16px 0;position:relative;overflow:hidden}
.sigil-wrap.scene::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 15%,transparent),color-mix(in srgb,var(--bg) 60%,transparent))}
.sigil-wrap.scene .sigil{position:relative;background:radial-gradient(circle,color-mix(in srgb,var(--bg) 84%,transparent) 50%,transparent 71%);border-radius:50%}
.endart{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:14px}
.wonder-art{display:block;width:calc(100% + 24px);margin:-12px -12px 10px;aspect-ratio:16/9;object-fit:cover;border-radius:4px 14px 0 0}
.wonder-art.dim{filter:grayscale(.7) brightness(.55)}
.wonder-art.ph{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#120d16);color:#a4958a;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}

/* ===== features ===== */

.race,.quests{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0;background:var(--surface)}
.race-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}

/* rotate prompt for phones held upright in the browser */
.rotate{position:fixed;inset:0;z-index:70;background:#120d16;color:#eadfc8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.rotate .ph{width:64px;height:104px;border:4px solid #d3ab52;border-radius:12px;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.rotate h2{font-family:var(--display);font-size:1.6rem}
.rotate p{color:#a4958a;max-width:30ch;margin:0}
@media (prefers-reduced-motion:reduce){.rotate .ph{animation:none;transform:rotate(-90deg)}}

}

/* lindol: every swallowed moon shakes all the islands */
function dropUpgrade(x){const ks=Object.keys(x.up).filter(k=>x.up[k]>1&&(k!=='shrine'||x.shrine));if(!ks.length)return null;const k=pick(ks);x.up[k]--;return UPG[k].names[x.up[k]];}
function lindol(src){

  for(const x of allW()){if(!x.alive)continue;
    if(x.up.shrine>=3&&x.shrine&&!x.qshield){x.qshield=true;if(x.isPlayer)hits.push('Your Salamin ng Buwan absorbed the shock.');continue;}
    const n=dropUpgrade(x);if(x.isPlayer&&n)hits.push(`Your buildings cracked: an upgrade fell back to ${n}.`);}
  log(`Lindol! The islands shake as ${src.isPlayer?'your':src.name+'’s'} Bakunawa swallows a moon.`,'omen');
  G.pending.push({t:`Lindol! The islands shake as ${src.isPlayer?'your':src.name+'’s'} Bakunawa swallows a moon. ${hits.join(' ')||'Your barangay held firm.'}`,k:'omen'});
}
/* bagyo: a typhoon every ~150 days, announced 10 days ahead */
function bagyoTick(){
  G.nextBagyo=G.nextBagyo||140+Math.floor(rnd()*30);
  if(G.day===G.nextBagyo-10){log('Signs of a bagyo: a typhoon will strike in 10 days.','omen');G.pending.push({t:'Paparating ang bagyo! A typhoon strikes in 10 days. A Kamalig halves the people it takes; a Muog keeps your upgrades standing.',k:'omen'});}
  if(G.day!==G.nextBagyo)return;
  G.nextBagyo=G.day+135+Math.floor(rnd()*30);
  const alive=allW().filter(w=>w.alive).sort(()=>rnd()-.5).slice(0,2);
  for(const x of alive){
    const lost=Math.round(x.pop*(x.up.farm>=3?.05:.1));x.pop-=lost;
    const n=x.up.bastion>=3?null:dropUpgrade(x);
    log(`The bagyo tore through ${x.isPlayer?'your barangay':x.name+'’s barangay'}: ${fmt(lost)} people lost${n?`, an upgrade fell back to ${n}`:''}.`,'omen');
    if(x.isPlayer)G.pending.push({t:`The bagyo hit your barangay: ${fmt(lost)} people lost${n?`, and an upgrade fell back to ${n}`:x.up.bastion>=3?'. Your Muog kept every upgrade standing':''}.`,k:'omen'});
  }
  if(!alive.some(x=>x.isPlayer))G.pending.push({t:`The bagyo struck ${alive.map(x=>x.name).join(' and ')}. Your barangay was spared.`,k:'omen'});
}

function ensureStats(){G.stats=G.stats||{wins:0,curses:0,explored:0,done:0};}

function hostile(a,b){ if(a===b) return false; if((a.isPlayer&&b.ally)||(b.isPlayer&&a.ally)) return false; return true; }
const built=w=>Object.values(w.b).reduce((s,n)=>s+n,0)+(w.shrine?1:0);
const freeLand=w=>Math.max(0,w.land-built(w));
function mod(w,key){let s=0;for(const k in w.ench){const f=SPELLS[k].fx[key];if(f)s+=f;}return s;}
const hasG=w=>!!w.g;
const gReady=w=>!!(w.g&&!w.g.wound);
const gIs=(w,s)=>hasG(w)&&w.school===s;
const popCap=w=>(w.land*6+w.b.farm*25*(w.up.farm>=2?1.5:1))*(w.school==='verdant'?1.15:1)*(1+.2*hh(w,'tubo')+(legIs(w,'verdant')?.25:0));
const goldIncome=w=>(w.pop*.12+w.b.market*12*(w.up.market>=2?1.5:1))*Math.min(2,1+mod(w,'gold')+.15*hh(w,'tagatago'));
const manaIncome=w=>(3+w.b.well*9*(w.up.well>=2?1.5:1)*(gIs(w,'dawn')?2:1)+w.land*.05)*Math.min(2,1+mod(w,'mana')+(w.school==='tide'?.1:0)+(gIs(w,'tide')?.3:0)+.25*hh(w,'nelson')+(wonderIs(w,'tide')?.2:0)+(legIs(w,'tide')?.5:0));

function upkeep(w){let g=0,m=0;for(const k in w.u){g+=w.u[k]*UNITS[k].upG;m+=w.u[k]*UNITS[k].upM*(legIs(w,'tide')&&UNITS[k].school==='tide'?.5:1);}const f=1-upkeepCut(w);return{g:g*f+heroUpkeep(w),m:m*f};}
const exploreCostPer=w=>(20+w.land*.5)*(1-.2*hh(w,'amihan'));

const atkBonus=w=>Math.min(.75,mod(w,'atk')+(w.school==='ember'?(hasG(w)?.3:.2):0)+.2*hh(w,'markdave')+(wonderIs(w,'ember')?.2:0)+(legIs(w,'ember')?.25:0));

function tick(w){
  if(!w.alive) return null;
  const eco=w.isPlayer?1:DIFFS[G.diff].eco;
  const cap=popCap(w);
  if(w.pop<cap) w.pop+=(cap-w.pop)*.05*(1+mod(w,'growth')); else w.pop-=(w.pop-cap)*.1;
  w.gold+=goldIncome(w)*eco;
  w.mana+=manaIncome(w)*eco;
  w.rp+=w.b.library*.3*(1+.5*hh(w,'leonard'));
  const up=upkeep(w); w.gold-=up.g; w.mana-=up.m;
  for(const k of ['gold','mana','pop','rp'])if(!isFinite(w[k]))w[k]=0;
  for(const k in w.u)if(!isFinite(w.u[k])||w.u[k]<0)w.u[k]=0;
  let flag=null;
  if(w.gold<0){for(const k in w.u)if(UNITS[k].upG>0)w.u[k]-=Math.ceil(w.u[k]*.03);w.gold=0;flag='gold';}
  if(w.mana<0){for(const k in w.u)if(UNITS[k].upM>0&&!(gIs(w,'tide')&&UNITS[k].school==='tide'))w.u[k]-=Math.ceil(w.u[k]*.03);w.mana=0;flag=flag?'both':'mana';}
  for(const k in w.ench){if(--w.ench[k]<=0){delete w.ench[k]; if(w.isPlayer) log(`${SPELLS[k].name} fades from your barangay.`,'magic');}}
  if(w.g){ if(w.g.cd>0)w.g.cd--; if(w.g.wound>0){w.g.wound--; if(!w.g.wound&&w.isPlayer)log(`${GUARDIANS[w.school].name} has healed and stands ready again.`,'you');} }
  if(w.gStance>0)w.gStance--; if(w.gSanct>0)w.gSanct--; if(w.blind>0)w.blind--;
  w.lostB=w.lostB.filter(x=>G.day-x.d<=10);
  if(w.build){w.build.left--;if(w.build.left<=0)completeBuild(w);}
  if(wonderIs(w,'verdant')&&w.lostB.length&&freeLand(w)>0){const x=w.lostB[0];const k=Object.keys(x.b).find(k=>x.b[k]>0);if(k){x.b[k]--;w.b[k]++;}else w.lostB.shift();}
  if(w.isPlayer&&wonderIs(w,'tide'))for(const r of G.rivals)if(r.alive)G.intel[r.id]=intelOf(r);
  if(w.rite&&w.chant>=MOON_TURNS&&!w.stand) tryOffer(w);
  if(w.stand>0){ w.stand--; if(w.stand===0){ w.moons=7; } }
  updateTier(w);
  legendTick(w);
  return flag;
}

function offerCost(w,m){const o=OFFER[m];return o.t==='mana'?Math.round(o.n*(isLeader(w)?1.1:1)*(w.up.shrine>=2?.75:1)):(o.n||0);}

function trimBuildings(w){let over=built(w)-w.land;const keys=Object.keys(w.b);let i=0;while(over>0&&i<5000){const k=keys[i%keys.length];if(w.b[k]>0){w.b[k]--;over--;}i++;}}
function tryOffer(w){

    if(f.steal){const n=Math.round(t.mana*f.steal);t.mana-=n;c.mana+=n;r.fx.push(`${n} mana stolen`);}
    if(f.ritual&&t.rite&&!t.stand&&t.chant>0){t.chant=Math.max(0,t.chant-(f.ritual>=20?3:1));r.fx.push('their chanting was slowed');}
  }

    log(ok?`${c.name} cast ${sp.name} on ${t.isPlayer?'you':t.name}.`:`${t.isPlayer?'Your':t.name+'’s'} wards turned aside ${c.name}’s ${sp.name}.`,'magic');

const PERSONA_W={builder:{farm:3,market:3,well:2,library:2,bastion:1},warlord:{farm:2,market:3,well:2,library:1,bastion:2},sage:{farm:2,market:2,well:3,library:3,bastion:1}};

  if(a.heroes.length<heroSlots(a)&&rnd()<.08){const h=aiPickHero(a);if(h&&a.gold>=HERO_COST[HEROES[h].c][0]*1.5){hireHero(a,h);return;}}
  if(!a.build&&rnd()<(a.persona==='builder'?.12:.06)){const k=aiPickUpgrade(a);if(k&&startBuild(a,k))return;}
  if(a.burned.length&&!a.bayani&&rnd()<.15){if(bayanihan(a,a.burned[0]))return;}
  if(freeLand(a)>0&&a.gold>=150){aiBuild(a);return;}
  if(a.gold>exploreCostPer(a)*acresPerTurn(a)*1.3&&rnd()<.7){explore(a);return;}
  const u=bestUnit(a);
  if(u&&a.mana>300+keep&&a.mana>unitCost(a,u)*4&&rnd()<.5){
    const q=Math.floor((a.mana-keep)*.55/unitCost(a,u));if(q>0){a.mana-=q*unitCost(a,u);a.u[u]=(a.u[u]||0)+q;return;}
  }
  if(a.gold>900&&rnd()<.6){const q=Math.floor(a.gold*.4/55);a.gold-=q*55;a.u.archer+=q;return;}
  if(a.tier<4&&rnd()<(a.persona==='sage'?.7:.45)){study(a);return;}
  if(a.mana<400+keep) meditate(a); else earn(a);
}

/* world resolution */
function resolveState(){
  for(const w of allW()){
    if(w.alive&&w.land<FALL_LAND){
      w.alive=false; w.rite=false; w.moons=0; w.chant=0; w.stand=0;
      log(w.isPlayer?'Your barangay falls. Your spirit is dragged back to Kasamaan.':`${w.name} has fallen. Their barangay lies in ruins.`,'fall');
      if(!w.isPlayer) G.pending.push({kx:{type:'fall',w:who(w)},t:`${w.name} has fallen.`,k:'fall'});
    }
  }
  if(!P().alive){G.over={win:false,why:'Your barangay was conquered.'};return;}
  for(const w of allW()){
    if(w.alive&&w.moons>=7){
      const friendly=w.isPlayer||w.ally;
      G.over={win:friendly,why:w.isPlayer?'The Bakunawa rises and swallows the last moon. In the new darkness, the islands answer only to you.':w.ally?`Your sandugo ally ${w.name} called the Bakunawa. You share the new age.`:`${w.name} called the Bakunawa. It swallowed the last moon, and the islands fell into their darkness.`};
      return;
    }
  }
  if(G.rivals.filter(r=>r.alive&&hostile(P(),r)).length===0){G.over={win:true,why:'Every rival babaylan has fallen. The islands are yours.'};return;}
  if(G.day>=SEASON){
    const rank=allW().filter(w=>w.alive).sort((x,y)=>(y.moons-x.moons)||(power(y)-power(x)));
    const top=rank[0];
    const by=top.moons>0?`holding ${top.moons} of the 7 moons`:'with the mightiest barangay';
    G.over={win:top.isPlayer||top.ally,why:`Day ${SEASON}: the Bakunawa wakes on its own. `+(top.isPlayer?`It answers to you, ${by}.`:top.ally?`It answers to your ally ${top.name}, ${by}.`:`It answers to ${top.name}, ${by}.`)};
  }
}
function runTurns(n,perTurn){
  let used=0,flag=null;
  for(let i=0;i<n&&!G.over;i++){
    if(perTurn&&perTurn(i)===false)break;
    const f=tick(P()); if(f)flag=f;
    for(const a of G.rivals) aiTurn(a);
    G.day++; G.bank--; used++;
    if(G.day>=90&&G.day%100===90){log('Ten days until an eclipse night. Chanting will count double for 10 turns.','omen');G.pending.push({kx:{type:'eclipse',soon:true},t:'An eclipse night begins in 10 days. For 10 turns, every turn of chanting counts double.',k:'omen'});}
    legendDay(); bagyoTick();
    if(G.day>=100&&G.day%100===0){log('The eclipse night begins. Chanting counts double for 10 turns.','omen');}
    resolveState();
  }
  if(flag) log(flag==='gold'?'Your treasury ran dry and soldiers deserted.':flag==='mana'?'Your mana ran dry and summoned creatures slipped away.':'Gold and mana both ran dry. Part of your army abandoned you.','you');
  return used;
}

function doBuild(){
  const p=P(),q=UI.bq;
  const tot=BUILDINGS.reduce((s,b)=>s+(q[b.k]||0),0), cost=BUILDINGS.reduce((s,b)=>s+(q[b.k]||0)*bcost(p,b.cost),0);
  if(!tot)return;
  if(tot>freeLand(p))return toast(`You only have ${freeLand(p)} free land.`);
  if(cost>p.gold)return toast(`That costs ${fmt(cost)} gold. You have ${fmt(p.gold)}.`);
  const turns=Math.ceil(tot/buildRate(p));
  if(G.bank<turns)return toast(`That needs ${turns} turns. You have ${G.bank}.`);
  p.gold-=cost; for(const b of BUILDINGS)p.b[b.k]+=(q[b.k]||0);
  runTurns(turns);
  const msg=`Built ${tot} building${tot>1?'s':''} over ${turns} turn${turns>1?'s':''}.`;
  log(msg,'you'); UI.bq={}; after(msg); 
}
function fillLand(){
  const p=P(); let free=freeLand(p), gold=p.gold; UI.bq={};
  const mix=['farm','market','market','well','library','farm','well','bastion'];
  let i=0,guard=0;
  while(free>0&&guard++<2000){const k=mix[i++%mix.length],c=bcost(p,BUILDINGS.find(b=>b.k===k).cost);if(gold<c)break;gold-=c;free--;UI.bq[k]=(UI.bq[k]||0)+1;}
  render();
}

function doAbility(){
  const p=P(),ab=GUARDIANS[p.school].ab;
  if(G.bank<1)return toast('No turns left.');
  if(p.mana<ab.cost)return toast(`${ab.name} needs ${ab.cost} mana.`);
  if(ab.key==='sanct'&&p.rite)return toast('Rooted Sanctuary can’t be used while you chant.');
  const go=t=>{const m=useAbility(p,t);if(!m)return toast('Your guardian can’t do that right now.');runTurns(1);log(m,'magic');after(m);};
  if(ab.target){ if(G.day<PROTECT)return toast(`Hostile magic is barred until day ${PROTECT}.`); return targetPicker(`${ab.name} on whom?`,go); }

}
function doHire(k){
  const p=P(),u=UNITS[k];
  if(G.bank<1)return toast('No turns left.');
  const price=unitCost(p,k), have=u.gold?p.gold:p.mana;
  let q=parseInt(UI.rq[k],10); const max=Math.floor(have/price);
  if(!q||q<0)q=max; q=Math.min(q,max);
  if(q<=0)return toast(`Not enough ${u.gold?'gold':'mana'}.`);
  if(u.gold)p.gold-=q*price; else p.mana-=q*price;
  p.u[k]=(p.u[k]||0)+q; UI.rq[k]='';
  runTurns(1);
  const msg=`${u.gold?'Recruited':'Summoned'} ${q} ${u.name}${q>1?'s':''}.`;log(msg,'you');after(msg);
}

function ritePanel(p){
  const m=Math.min(7,p.moons+1),o=OFFER[m];
  const list=`<ol class="offers">${OFFER.slice(1).map((x,i)=>`<li class="${i<p.moons?'done':i===p.moons&&p.rite?'now':''}"><span>Moon ${i+1}</span>${x.label}${x.t==='mana'&&isLeader(p)?' <small>(+10% leader’s burden)</small>':''}</li>`).join('')}</ol>`;
  let body='';
  if(p.tier<4) body=`<p class="note">Reach circle 4 of research, then build a Dambana ng Buwan (moon shrine) in the Build tab.</p>`;
  else if(!p.shrine) body=`<p class="note">${p.rite?'<b>Your moon shrine was destroyed!</b> Rebuild it in the Build tab to keep chanting.':`Build a Dambana ng Buwan in the Build tab (${fmt(SHRINE_COST)} gold) to begin.`}</p>`;
  else if(!p.rite) body=`<p class="note">Seven moons, each needing ${MOON_TURNS} turns of chanting (${CHANT_COST} mana a turn) and an offering. Every rival will hunt you while you chant, and each battle you lose makes the serpent spit out a moon.</p><button class="btn sch" data-ritual>Begin the rite</button>`;
  else if(p.stand>0) body=`<p><b>Final stand.</b> Survive ${p.stand} more turn${p.stand>1?'s':''} without losing a battle and the Bakunawa rises.</p><button class="btn sch" data-hold>Hold out ${Math.min(UI.count,p.stand)} turn${Math.min(UI.count,p.stand)>1?'s':''}</button>`;
  else{
    const ready=canOffer(p,m),full=p.chant>=MOON_TURNS;
    body=`<div class="meter"><i style="width:${p.chant/MOON_TURNS*100}%"></i></div>
    <p class="note">Moon ${m}: chanting <b>${p.chant}</b> / ${MOON_TURNS}${eclipseNow()?' · <b>eclipse: double speed</b>':''}. Offering: <b>${o.label}</b>${o.t==='mana'?` (${fmt(offerCost(p,m))})`:''} · ${ready?'ready, paid automatically when the chant completes':'<b>not ready yet</b>'}.</p>
    ${full&&!ready?`<p class="note warnline">The chant is complete, but the offering isn’t ready. ${o.t==='mana'?'Meditate for more mana.':o.t==='beast'?'Summon a circle 3 creature.':o.t==='land'?'Explore for more land.':o.t==='guardian'?'Awaken or heal your guardian.':''}</p>`:''}
    <button class="btn sch" data-channel ${full&&!ready?'disabled':''}>Chant ${UI.count} turn${UI.count>1?'s':''}</button>`;
  }
  return `<div class="ritual"><h3>Call the Bakunawa</h3>${moonRow(p)}${body}${list}</div>`;
}

function doCast(k){
  const p=P(),s=SPELLS[k],c=hexCost(p,k);
  if(G.bank<1)return toast('No turns left.');
  if(p.mana<c)return toast(`${s.name} needs ${c} mana.`);
  if(s.type==='scry'){
    if(p.blind)return toast(`You are blinded for ${p.blind} more turns.`);
    return targetPicker('Read the tawas for whom?',t=>{p.mana-=c;runTurns(1);
      G.intel[t.id]={d:G.day,gold:Math.round(t.gold),mana:Math.round(t.mana),tier:t.tier,atk:Math.round(armyAtk(t)),def:Math.round(armyDef(t)),units:{...t.u},ench:Object.keys(t.ench),rit:t.rite?t.moons:null};
      log(`Your tawas reveals ${t.name}’s barangay.`,'magic');UI.tab='war';UI.kq.unshift({type:'cast',sp:'scry',msg:`The wax reveals ${t.name}’s barangay: their gold, mana, army and lore are now on the Rivals tab.`});after(null);});
  }
  if(s.type==='hex'){
    if(G.day<PROTECT)return toast(`Hostile magic is barred until day ${PROTECT}.`);
    return targetPicker(`Cast ${s.name} on whom?`,t=>{
      const r=castHex(p,t,k); runTurns(1);
      const msg=r.ok?`${s.name} struck ${t.name}: ${r.fx.join(', ')||'little effect'}.`:`${t.name}’s wards turned aside your ${s.name}.`;
      log(msg,'magic'); UI.kq.unshift({type:'curse',own:1,c:who(p),t:who(t),sp:k,ok:r.ok,fx:r.fx.join(', ')}); after(null);
    });
  }
  const msg=castSelf(p,k); runTurns(1); log(msg,'magic'); UI.kq.unshift({type:'cast',sp:k,msg}); after(null); 
}

function attackDialog(id){
  const p=P(),t=byId(id);
  const turns=hh(p,'habagat')>=1?1:2;
  if(G.day<PROTECT)return toast(`The truce holds until day ${PROTECT}.`);
  if(G.bank<turns)return toast(`An attack needs ${turns} turn${turns>1?'s':''}.`);
  let f=.75, sendG=gReady(p), mode='land';
  const w=wheel(p,t);
  const burnTarget=()=>{if(t.wonder)return WONDERS[t.school].name;const ks=Object.keys(t.up).filter(k=>t.up[k]>1&&(k!=='shrine'||t.shrine)).sort((x,y)=>t.up[y]-t.up[x]);return ks.length?UPG[ks[0]].names[t.up[ks[0]]-1]:null;};
  const body=()=>`<p>Send part of your army against ${esc(t.name)}. Units you keep home still defend you.</p>
   <div class="chips">${[.25,.5,.75,1].map(x=>`<button class="chip" data-frac="${x}" aria-pressed="${f===x}">${x*100}%</button>`).join('')}</div>
   ${gReady(p)?`<div class="chips"><button class="chip" data-sendg aria-pressed="${sendG}">${sendG?'✓ ':''}Send ${esc(GUARDIANS[p.school].name)}</button></div>`:''}
   <p class="note" style="margin-bottom:4px"><b style="color:var(--ink)">If you win:</b></p>
   <div class="chips"><button class="chip" data-mode="land" aria-pressed="${mode==='land'}">Sakop · take land</button><button class="chip" data-mode="burn" aria-pressed="${mode==='burn'}">Sunog · burn</button></div>
   <p class="note">${mode==='burn'?(burnTarget()?`You’ll burn their <b style="color:var(--ink)">${esc(burnTarget())}</b> and take no land.${hh(t,'malakas')?' Malakas guards them: Sunog may fail.':''}`:'They have no upgrades or wonder to burn, so you’ll take land instead.'):'You’ll take some of their land, as usual.'}</p>
   <p class="note">Strike force attack: <b style="color:var(--ink)">${fmt(armyAtk(p,f,sendG)*(1+w))}</b>${w>0?' (counter wheel +20%)':w<0?' (counter wheel −10%)':''}${G.intel[id]?` vs their last seen defense ${fmt(G.intel[id].def)}`:'. Read a Tawas first to see their defense.'}${t.up.bastion>=3?' <b style="color:var(--danger)">Their Muog doubles your losses.</b>':''}</p>
   ${t.rite?'<p class="note"><b>They are chanting.</b> A win makes their Bakunawa spit out a moon.</p>':''}`;
  modal(`March on ${t.name}`,`<div id="atkBody">${body()}</div>`,[{t:'Cancel',cls:'ghost'},{t:`Attack · ${turns} turn${turns>1?'s':''}`,cls:'warn',fn:()=>{
    const r=doBattle(p,t,f,sendG,mode); runTurns(turns);
    const msg=r.win?`Victory over ${t.name}: ${r.burn?`burned their ${r.burn}`:`+${r.land} land`}.`:`Your army broke against ${t.name}’s defenses.`;
    log(msg,'war'); UI.kq.unshift({type:'battle',own:1,b:r.rec}); after(null);
  }}]);
  const wire=()=>{document.querySelectorAll('[data-frac]').forEach(b=>b.onclick=()=>{f=+b.dataset.frac;$('#atkBody').innerHTML=body();wire();});
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('#atkBody').innerHTML=body();wire();});
    const g=document.querySelector('[data-sendg]');if(g)g.onclick=()=>{sendG=!sendG;$('#atkBody').innerHTML=body();wire();};};

}
function doPots(id){
  const p=P(),t=byId(id);
  if(G.bank<1)return toast('No turns left.');
  if(p.gold<50)return toast('Kalampag needs 50 gold.');
  const ok=kalampag(p,t); runTurns(1);
  const msg=ok?`Your pots and gongs rang out: ${t.name}'s Bakunawa spat out a moon!`:`You banged pots at ${t.name}, but the serpent held on.`;
  log(msg,'omen'); after(msg); 
}

function mix(h,t,w='#ffffff'){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const a=p(h),b=p(w);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');}

/* ============ BATTLE REPORT ============ */
const uName=(k,n)=>UNITS[k]?UNITS[k].name:k;
function listUnits(arr){if(!arr||!arr.length)return '';const p=arr.map(([k,n])=>`${fmt(n)} ${uName(k)}`);return p.length>1?p.slice(0,-1).join(', ')+' and '+p[p.length-1]:p[0];}
function lossLine(m){if(!m)return '';const a=Object.entries(m).filter(([,n])=>n>0).sort((x,y)=>y[1]-x[1]).slice(0,3);return a.map(([k,n])=>`${fmt(n)} ${uName(k)}`).join(' · ');}
const TIMES=['at first light','at dusk','under a blood-red sky','at midnight','in the morning rain','as the tide turned'];
function battleStory(b){
  const youA=b.a.p,youD=b.d.p;
  const atk=youA?'Your army':`${b.a.n}'s army`, def=youD?'your barangay':`${b.d.n}'s barangay`;
  const when=TIMES[b.day%TIMES.length];
  const S=[];
  S.push(`${atk} ${b.win?'stormed':'marched on'} ${def} ${when}${b.fa&&b.fa.length?`, led by ${listUnits(b.fa)}`:''}.`);
  if(b.gA) S.push(`${GUARDIANS[b.gA].name} strode ahead of the attackers, and the ground shook with every step.`);
  if(b.chasm) S.push(`Before a single blow, the sea rose and swallowed ${fmt(b.chasm)} of them.`);
  const walls=b.kuta?`${fmt(b.kuta)} Kuta`:'bamboo palisades';
  S.push(`${youD?'Your':`${b.d.n}'s`} defenders held ${walls}${b.fd&&b.fd.length?` with ${listUnits(b.fd)}`:''}${b.gD?`, and ${GUARDIANS[b.gD].name} stood guard at the gate`:''}.`);
  if(b.sig) S.push('Sigbin slipped backwards past the walls, unseen, and opened a gap in the defense.');
  if(b.wh>0) S.push(`The attackers' way ran strong against ${SCHOOLS[b.d.s].name} (counter wheel +20%).`);
  if(b.wh<0) S.push(`${SCHOOLS[b.d.s].name} magic blunted the attack (counter wheel −10%).`);
  const r=b.A/Math.max(1,b.D);
  if(b.win&&b.burn) S.push(`Torches went up in the night, and the ${b.burn} burned.`);
  if(b.win&&b.burnFail) S.push('The torches were lit, but the bamboo would not catch: Malakas’s grove held.');
  if(b.scaf) S.push(`The half-built ${b.scaf} came crashing down.`);
  if(b.win) S.push(r>2?'The defense collapsed within the hour.':r>1.3?'After a hard fight, the defenders gave way.':'It was a near thing: the walls held until the very last charge.');
  else S.push(r<.5?'The charge broke against the walls and the attackers fled.':r<.85?'The defenders threw back wave after wave.':'The attackers came within a spear’s length of breaking through.');
  return S.join(' ');
}
function reportArt(b){
  const youA=b.a.p;
  const pref=youA?(b.win?'battle-victory':'battle-repelled'):(b.win?'raid-lost':'raid-held');
  if(ART[pref])return pref;
  const mine=youA?b.gA:b.gD, theirs=youA?b.gD:b.gA;
  if(mine&&ART[GUARDIANS[mine].art])return GUARDIANS[mine].art;
  if(theirs&&ART[GUARDIANS[theirs].art])return GUARDIANS[theirs].art;
  const top=b.fa&&b.fa[0]&&UNIT_ART[b.fa[0][0]];
  if(top&&ART[top])return top;
  return youA||!b.win?'mandirigma':'bg-barangay';
}
function battleReport(b){
  const youA=b.a.p, good=(youA&&b.win)||(!youA&&!b.win);
  const verdict=youA?(b.win?'Victory':'Repelled'):(b.win?'Overrun':'Raid held');
  const title=youA?(b.win?`Victory over ${b.d.n}`:`Repelled by ${b.d.n}`):(b.win?`${b.a.n} raided you`:`You held off ${b.a.n}`);
  const ac=SCHOOLS[b.a.s].color, dc=b.a.s===b.d.s?'#8a7f8f':SCHOOLS[b.d.s].color, tot=Math.max(1,b.A+b.D), aw=Math.round(b.A/tot*100);
  const chips=[];
  if(b.land)chips.push([youA?'good':'bad',`${youA?'+':'−'}${fmt(b.land)} land`]);

  if(b.rit)chips.push([youA?'good':'bad','Moon spat out']);
  if(b.shrine)chips.push([youA?'good':'bad','Moon shrine destroyed']);
  if(b.chasm)chips.push([youA?'bad':'good',`Sea swallowed ${fmt(b.chasm)}`]);
  if(b.gw)chips.push([youA?'bad':'good',`${GUARDIANS[b.gA].name} wounded`]);
  if(b.glvl)chips.push(['good',`${GUARDIANS[b.glvl].name} leveled up`]);
  if(b.burn)chips.push([youA?'good':'bad',`Burned: ${b.burn}`]);
  if(b.burnFail)chips.push([youA?'bad':'good','Sunog failed']);
  if(b.scaf)chips.push([youA?'good':'bad',`Construction wrecked: ${b.scaf}`]);
  if(b.muog)chips.push([youA?'bad':'good','Muog doubled attacker losses']);
  if(b.raisedA)chips.push([youA?'good':'bad',`${fmt(b.raisedA)} fallen rose as Amalanhig`]);
  if(b.raisedD)chips.push([youA?'bad':'good',`${fmt(b.raisedD)} fallen rose as Amalanhig`]);
  if(b.wh)chips.push(['info',`Counter wheel ${b.wh>0?'+20%':'−10%'}`]);
  const art=reportArt(b);
  return new Promise(res=>{
    const el=document.createElement('div');el.className='splash';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',title);
    el.innerHTML=`<div class="splash-card br" style="--c:${good?'var(--ok)':'var(--danger)'}">
      <div class="splash-frame br-art">${ART[art]?`<img class="splash-art" src="${ART[art]}" alt="">`:''}<div class="br-day">Day ${b.day}</div><div class="br-verdict ${good?'good':'bad'}">${verdict}</div></div>
      <div class="splash-body">
        <h2>${esc(title)}</h2>
        <div class="br-vs"><div><i style="background:${ac}"></i><b>${esc(b.a.p?'You':b.a.n)}</b><small>${SCHOOLS[b.a.s].name} · attack</small><span class="br-num" data-n="${b.A}">0</span></div>
          <div class="br-x">vs</div>
          <div class="r"><i style="background:${dc}"></i><b>${esc(b.d.p?'You':b.d.n)}</b><small>${SCHOOLS[b.d.s].name} · defense</small><span class="br-num" data-n="${b.D}">0</span></div></div>
        <div class="br-bar" aria-hidden="true"><span style="background:${ac};--w:${aw}%"></span><span style="background:${dc};--w:${100-aw}%"></span></div>
        <p class="br-story">${esc(battleStory(b))}</p>
        <div class="br-loss"><div><span>Attackers lost</span><b>${fmt(b.aL)}</b><small>${lossLine(b.la)}</small></div><div><span>Defenders lost</span><b>${fmt(b.dL)}</b><small>${lossLine(b.ld)}</small></div></div>
        ${chips.length?`<div class="br-chips">${chips.map(([c,t])=>`<span class="${c}">${esc(t)}</span>`).join('')}</div>`:''}
        <button class="btn sch" type="button">Close</button>
      </div></div>`;
    document.body.appendChild(el);
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.querySelectorAll('.br-num').forEach(s=>{const n=+s.dataset.n;if(reduce){s.textContent=fmt(n);return;}const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/900);s.textContent=fmt(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);});
    requestAnimationFrame(()=>el.querySelector('.br-bar').classList.add('on'));
    const btn=el.querySelector('button');btn.onclick=()=>{el.remove();res();};btn.focus({preventScroll:true});
  });
}

/* ============ HAMON (quests) ============ */
const QK={
  land:{lbl:g=>`Hold ${fmt(g)} land`,m:p=>p.land},
  bld:{lbl:g=>`Own ${fmt(g)} buildings`,m:p=>built(p)},
  atk:{lbl:g=>`Raise your attack to ${fmt(g)}`,m:p=>armyAtk(p)},
  wins:{lbl:g=>`Win ${g>1?'battles':'a battle'} (${g} total)`,m:p=>G.stats.wins},
  curse:{lbl:g=>`Land a curse on a rival (${g} total)`,m:p=>G.stats.curses},
  rp:{lbl:g=>`Gather ${fmt(g)} research`,m:p=>p.rp},
  pop:{lbl:g=>`Grow to ${fmt(g)} people`,m:p=>p.pop},
  awaken:{lbl:()=>'Awaken your guardian',m:p=>p.g?1:0},
  shrine:{lbl:()=>'Build a Dambana ng Buwan',m:p=>p.shrine?1:0},
  moon:{lbl:g=>`Swallow moon ${g}`,m:p=>p.moons},
  hero:{lbl:g=>`Invite ${g>1?g+' heroes':'a hero'} to your court`,m:p=>p.heroes.length},
  upg:{lbl:g=>`Complete upgrades (${g} levels total)`,m:p=>Object.values(p.up).reduce((s,v)=>s+v-1,0)+(p.wonder?1:0)}
};
function newQuest(){
  const p=P(),have=new Set((G.quests||[]).map(q=>q.k)),c=[];
  const add=(k,goal)=>{if(!have.has(k))c.push({k,goal:Math.round(goal)});};
  add('land',p.land+Math.max(20,p.land*.15)); add('bld',built(p)+10); add('atk',Math.max(armyAtk(p)*1.3,armyAtk(p)+200)); add('pop',p.pop*1.2);
  if(G.day>=PROTECT) add('wins',G.stats.wins+1);
  if(p.tier>=2) add('curse',G.stats.curses+1);
  if(p.tier<4) add('rp',Math.min(TIER_RP[p.tier+1],p.rp+150));
  if(p.tier>=3&&!p.g) add('awaken',1);
  if(p.tier>=4&&!p.shrine) add('shrine',1);
  if(p.rite&&p.moons<7) add('moon',p.moons+1);
  if(p.heroes.length<heroSlots(p)) add('hero',p.heroes.length+1);
  add('upg',Object.values(p.up).reduce((s,v)=>s+v-1,0)+(p.wonder?1:0)+1);
  const q=pick(c); const scale=1+G.day/250;
  const r=pick([{gold:Math.round(250*scale)},{mana:Math.round(150*scale)},{rp:Math.round(60*scale)},{gold:Math.round(150*scale),mana:Math.round(80*scale)}]);
  if(['awaken','shrine','moon','wins','upg'].includes(q.k)){for(const k in r)r[k]*=2;}
  return {...q,r};
}
function rewardText(r){return Object.entries(r).map(([k,v])=>`+${fmt(v)} ${k==='rp'?'research':k}`).join(', ');}
function ensureQuests(){G.stats=G.stats||{wins:0,curses:0,explored:0,done:0};G.quests=G.quests||[];while(G.quests.length<3)G.quests.push(newQuest());}
function checkQuests(){
  if(!G||G.over)return [];ensureQuests();const p=P(),done=[];
  G.quests=G.quests.map(q=>{if(QK[q.k].m(p)>=q.goal){for(const k in q.r)p[k]+=q.r[k];G.stats.done++;done.push(q);log(`Hamon complete: ${QK[q.k].lbl(q.goal)}. Reward: ${rewardText(q.r)}.`,'you');return null;}return q;}).filter(Boolean);
  ensureQuests();return done;
}
function questCard(){
  ensureQuests();const p=P();
  return `<div class="quests"><div class="race-h"><h2>Mga Hamon</h2><small>Challenges · ${G.stats.done} done</small></div>${G.quests.map(q=>{const v=QK[q.k].m(p),pct=Math.max(0,Math.min(100,v/q.goal*100));return `<div class="q"><div class="q-t"><b>${esc(QK[q.k].lbl(q.goal))}</b><span>${rewardText(q.r)}</span></div><div class="meter"><i style="width:${pct}%"></i></div></div>`;}).join('')}</div>`;
}

function omenArt(o,r){const keys=o.rival&&r?[`rival-${({ember:'apoy',tide:'dagat',verdant:'gubat',gloam:'dilim',dawn:'liwanag'})[r.school]}`,'victory']:o.art;return keys.find(k=>ART[k])||'bg-barangay';}
function maybeOmen(){
  if(!G||G.over||G.day<15)return null;
  G.nextOmen=G.nextOmen||G.day+15+Math.floor(rnd()*15);
  if(G.day<G.nextOmen)return null;
  G.nextOmen=G.day+25+Math.floor(rnd()*20);
  const recent=G.omens||[];let pool=OMENS.filter(o=>!recent.includes(o.id));if(!pool.length)pool=OMENS;
  const o=pick(pool);G.omens=[o.id,...recent].slice(0,4);
  return o;
}
function showOmen(o){
  const p=P(),r=o.rival?pick(G.rivals.filter(x=>x.alive&&!x.ally&&hostile(p,x))):null;
  if(o.rival&&!r)return Promise.resolve();
  const text=o.rival?`${esc(r.name)} of ${SCHOOLS[r.school].name} sends an envoy bearing gifts and a warning. “Our warriors grow restless,” the envoy says. “Perhaps you would rather be friends?”`:esc(o.x);
  return new Promise(res=>{
    const el=document.createElement('div');el.className='splash';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',o.t);
    el.innerHTML=`<div class="splash-card" style="--c:var(--gold)"><div class="splash-frame"><img class="splash-art" src="${ART[omenArt(o,r)]}" alt=""></div><div class="splash-body"><div class="splash-kicker">Pangitain · an omen</div><h2>${esc(o.t)}</h2><p>${text}</p><div class="omen-c">${o.c.map((c,i)=>`<button class="btn ${i?'ghost':'sch'}" data-oc="${i}"><b>${esc(c.l)}</b><small>${esc(c.d())}</small></button>`).join('')}</div></div></div>`;
    document.body.appendChild(el);
    el.querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{const c=o.c[+b.dataset.oc];const out=c.f(p,r);for(const k of ['gold','mana','pop'])p[k]=Math.max(0,Math.round(p[k]));log(`${o.t}: ${out}`,'omen');save();
      el.querySelector('.splash-body').innerHTML=`<div class="splash-kicker">Pangitain · an omen</div><h2>${esc(o.t)}</h2><p>${esc(out)}</p><button class="btn sch" type="button">Ituloy ▸</button>`;
      el.querySelector('.splash-body button').onclick=()=>{el.remove();render();res();};el.querySelector('.splash-body button').focus({preventScroll:true});});
    el.querySelector('[data-oc]').focus({preventScroll:true});
  });
}

/* ============ RESOURCE FLOATERS ============ */
function snapRes(){const p=P();return [p.gold,p.mana,p.land,p.pop,power(p)];}
function floatDeltas(prev){
  if(!prev||!G||G.over)return;const now=snapRes(),cells=document.querySelectorAll('.res > div');
  now.forEach((v,i)=>{const d=Math.round(v-prev[i]);if(!d||!cells[i])return;if(Math.abs(d)<1)return;
    const f=document.createElement('span');f.className='floater '+(d>0?'up':'down');f.textContent=(d>0?'+':'−')+fmt(Math.abs(d));f.setAttribute('aria-hidden','true');cells[i].appendChild(f);setTimeout(()=>f.remove(),1700);});
}

  for(const s of W){const L=LEGENDS[s],lk=!seen.includes(s);add('Legends',L.art,lk?'???':L.name,lk?`The hidden legend of ${SCHOOLS[s].name}`:`${L.title} · legend of ${SCHOOLS[s].name}`,lk?`${L.riddle} ${L.hint} Bind this legend in a game to reveal the painting.`:L.fx,lk);}

function openGallery(){
  closeModal();document.querySelectorAll('.gal').forEach(g=>g.remove());

  let grp='All';
  const el=document.createElement('div');el.className='gal';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Art gallery');
  const shown=()=>items.map((it,i)=>({...it,i})).filter(it=>grp==='All'||it.g===grp);
  const draw=()=>{
    const open=items.filter(i=>!i.locked).length;
    el.innerHTML=`<div class="gal-top"><div><h2>Galeriya</h2><small>${open} of ${items.length} paintings revealed</small></div><button class="iconbtn gal-x" aria-label="Close gallery">✕</button></div>
    <div class="chips gal-chips" role="group" aria-label="Filter">${groups.map(g=>`<button class="chip" data-g="${g}" aria-pressed="${g===grp}">${g}</button>`).join('')}</div>
    <div class="gal-grid">${shown().map(it=>`<button class="gal-tile${it.locked?' locked':''}" data-i="${it.i}" aria-label="${esc(it.title)}"><img src="${ART[it.art]}" alt="" loading="lazy">${it.locked?'<span class="gal-q">?</span>':''}<span class="gal-cap">${esc(it.title)}</span></button>`).join('')}</div>`;
    el.querySelector('.gal-x').onclick=()=>el.remove();
    el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{grp=b.dataset.g;draw();});
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>view(+b.dataset.i));
  };
  const view=i=>{
    const list=shown().map(x=>x.i);let pos=list.indexOf(i);

    const show=()=>{const it=items[list[pos]];lb.setAttribute('aria-label',it.title);
      lb.innerHTML=`<div class="gal-lb-in"><div class="gal-lb-img${it.locked?' locked':''}"><img src="${ART[it.art]}" alt="${it.locked?'':esc(it.title)}">${it.locked?'<span class="gal-q big">?</span>':''}</div>
      <div class="gal-lb-body"><div class="gal-k">${esc(it.g)} · ${pos+1} of ${list.length}</div><h2>${esc(it.title)}</h2><div class="gal-sub">${esc(it.sub)}</div><p>${esc(it.text)}</p>
      <div class="gal-nav"><button class="btn ghost" data-nav="-1" ${pos===0?'disabled':''}>◂ Prev</button><button class="btn sch" data-nav="x">Close</button><button class="btn ghost" data-nav="1" ${pos===list.length-1?'disabled':''}>Next ▸</button></div></div></div>`;
      lb.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const v=b.dataset.nav;if(v==='x'){lb.remove();document.removeEventListener('keydown',key);return;}pos=Math.max(0,Math.min(list.length-1,pos+ +v));show();});
      lb.querySelector('[data-nav="x"]').focus({preventScroll:true});};
    const key=e=>{if(!document.body.contains(lb)){document.removeEventListener('keydown',key);return;}if(e.key==='ArrowRight'&&pos<list.length-1){pos++;show();}if(e.key==='ArrowLeft'&&pos>0){pos--;show();}if(e.key==='Escape'){lb.remove();document.removeEventListener('keydown',key);}};
    let sx=null;lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
    lb.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){const n=pos+(dx<0?1:-1);if(n>=0&&n<list.length){pos=n;show();}}});
    document.addEventListener('keydown',key);el.appendChild(lb);show();
  };
  document.body.appendChild(el);draw();el.querySelector('.gal-x').focus({preventScroll:true});
}

const FS_KEY='babaylan-fs';
const LAUNCHED_AS_APP=!!window.Capacitor||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||(matchMedia('(display-mode: fullscreen)').matches&&!document.fullscreenElement&&!document.webkitFullscreenElement);
const inApp=()=>LAUNCHED_AS_APP;
const fsSupported=()=>{const e=document.documentElement;return !inApp()&&!!(e.requestFullscreen||e.webkitRequestFullscreen);};
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function lockLandscape(){try{const o=screen.orientation;if(o&&o.lock){const r=o.lock('landscape');if(r&&r.catch)r.catch(()=>{});}}catch(_){}}
function enterFS(){if(!fsSupported()||isFS())return;const e=document.documentElement;try{const r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e,{navigationUI:'hide'});if(r&&r.then)r.then(lockLandscape).catch(()=>{});try{localStorage.setItem(FS_KEY,'1');}catch(_){}}catch(_){}}
function exitFS(){try{localStorage.setItem(FS_KEY,'0');}catch(_){}const d=document;(d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d);}
function toggleFS(){isFS()?exitFS():enterFS();}
const ROT_KEY='babaylan-portrait-ok';
function rotateCheck(){
  const want=!window.Capacitor&&matchMedia('(pointer:coarse)').matches&&innerHeight>innerWidth&&innerWidth<700;
  let ok=false;try{ok=localStorage.getItem(ROT_KEY)==='1';}catch(e){}

      el.querySelector('button').onclick=()=>{try{localStorage.setItem(ROT_KEY,'1');}catch(e){}el.remove();};document.body.appendChild(el);}}
  else if(el)el.remove();
}
addEventListener('resize',rotateCheck);addEventListener('orientationchange',()=>setTimeout(rotateCheck,200));

  if(k.type==='battle'&&(k.own||force)) return battleReport(k.b);
  if(k.type==='cast'){const sp=SPELLS[k.sp];if(ART['rite-'+k.sp])return showScene({art:'rite-'+k.sp,c:sp.school?SCHOOLS[sp.school].color:'#d3ab52',kicker:'Binigkas ang orasyon',title:sp.name,sub:sp.desc,text:esc(k.msg),btn:'Ituloy ▸'});toast(k.msg);return Promise.resolve();}
  if(k.type==='curse'&&k.own&&ART['rite-'+k.sp]){const sp=SPELLS[k.sp];return showScene({art:'rite-'+k.sp,c:sp.school?SCHOOLS[sp.school].color:'#d3ab52',kicker:k.ok?'Tumama ang sumpa · the curse lands':'Nabigo ang sumpa · the curse fails',title:sp.name,sub:`Cast on ${k.t.n}`,text:k.ok?`<b>${sp.name}</b> struck ${esc(k.t.n)}: ${esc(k.fx||'little effect')}.`:`${esc(k.t.n)}’s wards turned aside your ${sp.name}.`,btn:'Ituloy ▸'});}
  if(k.type==='curse'&&k.own){const sp=SPELLS[k.sp];return modal(k.ok?'The curse lands':'The curse fails',`<p>${k.ok?`<b>${sp.name}</b> struck ${esc(k.t.n)}: ${esc(k.fx||'little effect')}.`:`${esc(k.t.n)}’s wards turned aside your ${sp.name}.`}</p>`);}
  return Promise.resolve();
}

/* bindings & flow */
async function after(msg){
  const prev=UI.snap;
  const qd=checkQuests();
  save(); render(); floatDeltas(prev);
  const own=UI.kq.splice(0);
  const items=G.pending.splice(0);
  if(G.over&&!G.overShown){G.overShown=true;}
  save();
  const q=[...own]; let n=0;
  for(const it of items){ if(it.kx&&n<3&&sceneAllowed(it.kx)){q.push(it.kx);it.shown=true;n++;} }
  for(const k of q) await playKx(k);
  if(G.over){render();return;}
  const rest=[...qd.map(x=>({k:'you',t:`Hamon complete: ${QK[x.k].lbl(x.goal)}. Reward: ${rewardText(x.r)}.`})),...items.filter(i=>!i.shown)];
  if(rest.length) await modal(qd.length&&rest.length===qd.length?'Hamon complete!':'While you worked',`<ul class="log">${rest.map(i=>`<li class="${i.k}">${esc(i.t)}</li>`).join('')}</ul>`);
  else if(msg) toast(msg);
  const om=maybeOmen(); if(om){save(); await showOmen(om);}
  UI.snap=snapRes();
}
function bindGame(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;render();$('#main').scrollTop=0;});
  $('#menuBtn').onclick=menu;
  document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{UI.count=+b.dataset.count;render();});
  document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>doActivity(b.dataset.do));
  document.querySelectorAll('[data-bq]').forEach(b=>b.onclick=()=>{const k=b.dataset.bq;UI.bq[k]=Math.max(0,(UI.bq[k]||0)+ +b.dataset.d);render();});
  document.querySelectorAll('[data-bqi]').forEach(i=>i.onchange=()=>{UI.bq[i.dataset.bqi]=Math.max(0,parseInt(i.value,10)||0);render();});
  if($('#bGo'))$('#bGo').onclick=doBuild;
  if($('#bFill'))$('#bFill').onclick=fillLand;
  document.querySelectorAll('[data-rq]').forEach(i=>i.oninput=()=>UI.rq[i.dataset.rq]=i.value);
  document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>doHire(b.dataset.hire));
  document.querySelectorAll('[data-cast]').forEach(b=>b.onclick=()=>doCast(b.dataset.cast));
  document.querySelectorAll('[data-attack]').forEach(b=>b.onclick=()=>attackDialog(b.dataset.attack));
  document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>playKx({type:'battle',b:G.battles[+b.dataset.replay]},true));
  const rb=document.querySelector('[data-ritual]');
  if(rb)rb.onclick=()=>{const p=P();if(G.bank<1)return toast('No turns left.');
    modal('Call the Bakunawa?','<p>Every rival will learn of it and turn their armies on you. Each battle you lose while chanting makes the serpent spit out a moon.</p>',[{t:'Not yet',cls:'ghost'},{t:'Begin',cls:'sch',fn:()=>{beginRitual(p);runTurns(1);after('The chant has begun.');}}]);};
  const cb=document.querySelector('[data-channel]');
  if(cb)cb.onclick=()=>{if(G.bank<1)return toast('No turns left.');const p=P();const m0=p.moons;
    const used=runTurns(Math.min(UI.count,G.bank),()=>{if(p.stand>0||!p.rite)return false;if(chant(p)===false)return false;});
    if(!used)return toast(p.chant>=MOON_TURNS?'The offering isn’t ready yet.':`Chanting needs ${CHANT_COST} mana a turn.`);
    log(`You chanted to the Bakunawa for ${used} turn${used>1?'s':''}.`,'omen');
    after(p.moons>m0?`The Bakunawa swallowed moon ${p.moons}!`:p.stand?'The final stand begins!':`Moon ${p.moons+1}: ${p.chant}/${MOON_TURNS} chanted.`);};
  const hb=document.querySelector('[data-hold]');
  if(hb)hb.onclick=()=>{if(G.bank<1)return toast('No turns left.');const p=P();const used=runTurns(Math.min(UI.count,G.bank,p.stand));log(`You held your ground for ${used} turn${used>1?'s':''}.`,'omen');after(p.stand?`${p.stand} turns of the final stand remain.`:null);};
  if($('#shrineBtn'))$('#shrineBtn').onclick=()=>{const p=P();if(G.bank<1)return toast('No turns left.');if(p.gold<bcost(p,SHRINE_COST))return toast(`The moon shrine costs ${fmt(bcost(p,SHRINE_COST))} gold.`);if(freeLand(p)<1)return toast('You need 1 free acre.');buildShrine(p);runTurns(1);after('The Dambana ng Buwan is built.');};
  if($('#awakenBtn'))$('#awakenBtn').onclick=doAwaken;
  if($('#abilBtn'))$('#abilBtn').onclick=doAbility;
  document.querySelectorAll('[data-pots]').forEach(b=>b.onclick=()=>doPots(b.dataset.pots));
  document.querySelectorAll('[data-upg]').forEach(b=>b.onclick=()=>{const p=P(),k=b.dataset.upg;if(G.bank<1)return toast('No turns left.');const why=canBuild(p,k);if(why)return toast(why);startBuild(p,k);const nm=buildName(p,p.build);runTurns(1);log(`Construction begins: ${nm}.`,'you');after(`Construction has begun: ${nm}.`);});
  document.querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>{const p=P();if(b.dataset.trade==='g2m'){if(p.gold<300)return toast('You need 300 gold.');p.gold-=300;p.mana+=100;}else{if(p.mana<300)return toast('You need 300 mana.');p.mana-=300;p.gold+=100;}log('You traded at the Daungan.','you');after('Traded at the Daungan.');});
  document.querySelectorAll('[data-bay]').forEach(b=>b.onclick=()=>{const p=P();if(bayanihan(p,b.dataset.bay)){after('Bayanihan! The barangay rebuilt together.');}else toast('You can’t do that right now.');});
  if($('#hireBtn'))$('#hireBtn').onclick=heroPicker;
  document.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=()=>{const p=P(),k=b.dataset.dismiss;modal(`Dismiss ${HEROES[k].name}?`,'<p>They leave your court. You can invite them again later at full cost.</p>',[{t:'Keep',cls:'ghost'},{t:'Dismiss',cls:'warn',fn:()=>{dismissHero(p,k);save();render();}}]);});

}
function menu(){
  modal('Menu',`<p><b>How to play.</b> Turns are your lifeblood: they trickle in over time (${MODES[G.mode].note.toLowerCase()}) and every action spends them. Rivals take one action for every turn you spend.</p>
  <p><b>The race.</b> Reach circle 4, build a Dambana ng Buwan, and chant the Bakunawa rite. Each of the seven moons needs ${MOON_TURNS} turns of chanting plus an offering. Every battle you lose while chanting makes the serpent spit out a moon. Eclipse nights every 100 days double your chanting.</p>
  <p><b>Guardians.</b> At circle 3, the Pagtawag rite awakens your tribe’s guardian (Army tab). It fights beside your army, grows with victories, and has a powerful ability.</p>
  <p><b>Court and village.</b> Invite heroes to your court (Army tab), upgrade every building type to level 3, and raise your way’s wonder (Build tab). When you win a raid, choose <i>Sakop</i> to take land or <i>Sunog</i> to burn their best upgrade. Once a season, a Bayanihan rebuilds something burned at half cost.</p>
  <p><b>Legends and disasters.</b> Each way hides a legend, unlocked by a riddle on the Rites tab. Every moon swallowed shakes the islands (lindol), knocking an upgrade back a level in every barangay, and a bagyo strikes two barangays about every 150 days.</p>
  <p><b>Counter wheel.</b> Dagat → Apoy → Gubat → Dilim → Liwanag → Dagat. Each way strikes 20% harder against the next.</p>
  <p>Win by swallowing all seven moons, by making every hostile rival fall (below ${FALL_LAND} land), or by holding the most moons when day ${SEASON} arrives.</p>
  <p class="note">Paintings: ${Object.keys(ART).length} of 95 in the game so far. The rest are to follow.</p>
  <p class="note">${MODES[G.mode].name} pace · ${DIFFS[G.diff].name} rivals · ${G.variant==='covenant'?'Sandugo':'Solo'}</p>`,
  [...(fsSupported()?[{t:isFS()?'⤢ Exit full screen':'⛶ Full screen',cls:'ghost',fn:toggleFS}]:[]),{t:'Art gallery',cls:'sch',fn:openGallery},{t:'Abandon this reign',cls:'warn',fn:()=>modal('Abandon this reign?','<p>Your save will be erased and you start over.</p>',[{t:'Keep playing',cls:'ghost'},{t:'Erase and restart',cls:'warn',fn:()=>{wipe();G=null;render();}}])},{t:'Close'}]);
}
function updateBank(){
  if(!G||G.over)return;
  const before=G.bank; refreshBank();
  const n=$('#bankN'),t=$('#bankT'); if(!n)return;
  n.textContent=G.bank;
  const m=MODES[G.mode];
  if(G.bank>=m.cap)t.textContent='turns (full)';
  else{const s=Math.ceil((m.rate-(Date.now()-G.lastTick))/1000);t.textContent=`turns · +1 in ${s>=60?Math.ceil(s/60)+'m':s+'s'}`;}
  if(G.bank!==before)save();
}
function refreshBank(){
  const m=MODES[G.mode],now=Date.now();
  if(!(G.lastTick<=now))G.lastTick=now;
  if(G.bank>=m.cap){G.lastTick=now;return;}
  const n=Math.floor((now-G.lastTick)/m.rate);
  if(n>0){G.bank=Math.min(m.cap,G.bank+n);G.lastTick+=n*m.rate;if(G.bank>=m.cap)G.lastTick=now;}
}
setInterval(updateBank,1000);
/* tap guard: ignore an accidental second tap on an action within 0.35 s */
let tapLock=0,tapKey='';
document.addEventListener('click',e=>{const b=e.target.closest('main button,#scrim [data-mb],.bar-foot button');if(!b||b.matches('.chip,[data-count],[data-bq],[data-frac],[data-mode],[data-sendg]'))return;const key=b.textContent+'|'+[...b.attributes].map(x=>x.name+'='+x.value).join(',');const t=Date.now();if(key===tapKey&&t<tapLock){e.stopPropagation();e.preventDefault();return;}tapKey=key;tapLock=t+350;},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&G&&!G.over){refreshBank();render();}});

G=load(); if(G){refreshBank();G.battles=G.battles||[];}
rotateCheck();
render();
</script>
